<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dojo Companion</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <main id="app">
      <header id="head">
        <h1 id="lesson-title">Focus lesson</h1>
        <span id="chapter-chip" hidden></span>
      </header>

      <div id="player-shell">
        <iframe
          id="yt-player"
          title="Lesson player"
          allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
        ></iframe>

        <section id="end-card" hidden>
          <h2>Lesson complete</h2>
          <p>Your watch progress was saved.</p>
          <div id="end-actions"></div>
        </section>
      </div>

      <!-- UX defect #4d: shown when player.html is opened without a
           videoId param (e.g. from the toolbar icon) instead of a
           broken empty player. -->
      <section id="setup-card" hidden>
        <h2>Paste a YouTube link to focus on</h2>
        <input
          id="setup-video-input"
          type="text"
          placeholder="YouTube URL or 11-char video id"
          autocomplete="off"
          spellcheck="false"
        />
        <input
          id="setup-platform-input"
          type="text"
          placeholder="Platform URL (optional, e.g. http://localhost:3000)"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="setup-error" role="alert" hidden></p>
        <button id="setup-start-btn" type="button" class="btn btn-primary">
          Start focus lesson
        </button>
      </section>

      <footer id="foot">
        <button id="exit-btn" type="button">Exit lesson</button>
        <span id="meter"></span>
        <span id="status" role="status" aria-live="polite">Starting…</span>
      </footer>
    </main>

    <script src="player.js"></script>
  </body>
</html>
